name: Atualizar shorts
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar shorts
        run: |
          CHANNEL_ID="UCAHNIqJTD9ditXA36sQaSRw"
          PLAYLIST="PLTDh5tDTyWE"
          curl -s "https://www.youtube.com/feeds/videos.xml?playlist_id=$PLAYLIST" -o feed.xml
          python3 - <<'EOF'
          import re, json
          x = open("feed.xml", encoding="utf-8").read()
          ids = re.findall(r"<yt:videoId>(.*?)</yt:videoId>", x)[:4]
          if not ids:
              raise SystemExit("feed vazio")
          json.dump(ids, open("videos.json", "w"))
          EOF
          rm feed.xml
      - name: Salvar
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "atualiza shorts" && git push)
