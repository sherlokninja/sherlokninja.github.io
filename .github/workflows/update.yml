name: Atualizar shorts
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar shorts
        run: |
          CHANNEL_ID="UCAHNIqJTD9ditXA36sQaSRw"
          curl -sL -A "Mozilla/5.0" "https://www.youtube.com/feeds/videos.xml?channel_id=$CHANNEL_ID" -o feed.xml
          IDS=$(grep -o "<yt:videoId>[^<]*" feed.xml | sed 's/<yt:videoId>//')
          OUT=""
          N=0
          for ID in $IDS; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "https://www.youtube.com/shorts/$ID")
            if [ "$CODE" = "200" ]; then
              OUT="$OUT\"$ID\","
              N=$((N+1))
            fi
            if [ $N -ge 4 ]; then break; fi
          done
          if [ $N -eq 0 ]; then
            echo "nenhum short encontrado"
            head -c 500 feed.xml
            exit 1
          fi
          echo "[${OUT%,}]" > videos.json
          cat videos.json
          rm feed.xml
      - name: Salvar
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "atualiza shorts" && git push)
